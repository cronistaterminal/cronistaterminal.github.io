# Host: GitHub Pages (decisão do Nilton, 2026-07-13 — antes era Cloudflare Pages).
#
# cronistaterminal.github.io é um site de USUÁRIO/ORG, então o GitHub serve na RAIZ do
# domínio — não num subpath. Isso NÃO é detalhe: o site tem paths ABSOLUTOS hardcoded
# (/icons/, /logo/, /fonts/ nos favicons, no wordmark e nas masks de CSS) que não passam
# por relURL. Num project page (…github.io/dablog/) todos quebrariam de uma vez.
# -> Se um dia o site virar project page ou ganhar subpath, ESTES paths são o que quebra.
#
# A barra final importa: o Hugo concatena baseURL + path, e sem ela as URLs absolutas do
# RSS/sitemap saem grudadas.
baseURL = 'https://cronistaterminal.github.io/'
defaultContentLanguage = 'pt-br'
title = 'O Cronista Terminal'

# Multilíngue: pt-BR na RAIZ, inglês em /en/ (decisões na issue #2, 2026-11-20).
# defaultContentLanguageInSubdir = false é o que mantém as URLs já publicadas: com true,
# o pt-BR iria para /pt-br/ e todo link existente quebraria. URL é contrato.
#
# A tradução é por NOME DE ARQUIVO: content/posts/x.md + x.en.md, lado a lado. O Hugo
# pareia os dois pelo caminho; a URL do inglês vem do `slug` do próprio .en.md.
# Arquivo sem sufixo de idioma é do defaultContentLanguage (pt-br).
#
# O title NÃO se traduz: "O Cronista Terminal" é nome próprio (a persona), não descrição.
defaultContentLanguageInSubdir = false

# robots.txt gerado pelo Hugo (layouts/robots.txt) em vez de estático: assim ele
# aponta o Sitemap pela baseURL, sem hardcode de domínio.
enableRobotsTXT = true

# A ordem importa: em TOML, toda chave solta DEPOIS de um cabeçalho [tabela] pertence a
# essa tabela. Com o [languages] acima do enableRobotsTXT, a chave virou
# languages.en.params.enableRobotsTXT e o robots.txt sumiu do build sem erro nenhum.
# Chave de topo fica ACIMA de qualquer tabela.
[languages]
  [languages.pt-br]
    locale = 'pt-br'
    label = 'Português'
    weight = 1
    [languages.pt-br.params]
      description = 'Crônicas de um terminal — histórias de computação, contadas por época.'
  [languages.en]
    locale = 'en'
    label = 'English'
    weight = 2
    [languages.en.params]
      description = 'Chronicles from a terminal — computing stories, told by era.'

# O blog é arquivo cronológico; sumários/listas vêm dos campos do front matter,
# não do markdown bruto. Mantido enxuto por ora — cresce com os componentes.
#
# Params comuns aos dois idiomas. O que muda por idioma (description) mora em
# [languages.<lang>.params], acima: o Hugo funde os dois, e o do idioma vence.
[params]
  # author: usado no JSON-LD (schema.org author/publisher) e no article:author. É a
  # PERSONA (a alcunha do /cronista/), não o nome real — é a voz que assina o blog.
  author = 'O Cronista Terminal'

  # URLs dos perfis do rodapé. Moram aqui, e não no footer.html, porque são DADO:
  # trocar um perfil não deve mexer em template. Chave AUSENTE significa "sem perfil"
  # e o ícone some do rodapé — um href="#" morto é pior que um ícone a menos.
  # O RSS não entra aqui: ele é derivado da própria .Site (OutputFormats), não um perfil.
  [params.social]
    github = 'https://github.com/niltonfrederico/'
    bluesky = 'https://bsky.app/profile/cronistaterminal.bsky.social'
    linkedin = 'https://www.linkedin.com/in/nilton-teixeira/'

# pagerSize baixo de propósito enquanto há poucos posts seed: força >1 página p/
# validar o componente de paginação (janela primeira/prev/atual/próxima). Subir
# para ~10 quando houver volume real.
[pagination]
  pagerSize = 2

# Syntax highlight pelo Chroma (server-side, embutido no Hugo) em vez de Prism:
# o HTML já sai colorido do build, sem JS no critical path e sem flash de código
# sem cor. noClasses=false é o que torna o tema possível — o Chroma emite CLASSES
# (.k, .s, .c…) e quem pinta é o assets/css/code.css, com var(--…) do tema; se
# fosse true, ele inlinaria hex fixo e o highlight não recoloriria ao trocar de
# tema. guessSyntax=false: fence sem linguagem fica sem cor (melhor que adivinhar
# errado). lineNos desligado — o Chroma emitiria uma <table> só para isso.
[markup]
  # Hooks embutidos de link/imagem do Hugo. O default 'auto' vira 'fallback' sozinho
  # quando o site é multilíngue — fica declarado aqui para não ser surpresa. Com ele, um
  # link Markdown para página interna ([x](/cronista/)) resolve para a versão do MESMO
  # idioma do post, que é o que a tradução por arquivo precisa. Efeito colateral visível
  # no HTML: a URL sai normalizada (`(` vira `%28`) — equivalente, não é quebra.
  [markup.goldmark.renderHooks.link]
    useEmbedded = 'fallback'
  [markup.goldmark.renderHooks.image]
    useEmbedded = 'fallback'
  [markup.highlight]
    noClasses = false
    guessSyntax = false
    lineNos = false
    tabWidth = 4
    wrapperClass = 'code-block'

# Só `tags`. O Hugo habilita tag+category por padrão; sem isto, /categories/
# renderizava um índice de taxonomia vazio (o modelo de dados do post não tem
# categoria — ver o front matter: num/epoca/tldr/tldr_long/tags).
[taxonomies]
  tag = 'tags'

# URL dos posts: /aaaa/mm/dd/<slug>/. O :slug vem do front matter (NÃO do title
# urlizado): cada post carrega um `slug = "<kebab-do-titulo>-<4rand>"` congelado —
# os 4 caracteres aleatórios são gerados UMA vez (tools/new-post.py) e nunca mudam,
# porque URL é contrato. O Hugo não tem token de random no permalink (build é
# determinístico), então a entropia mora no conteúdo, não aqui.
# /aaaa/ e /aaaa/mm/ NÃO são páginas navegáveis (decisão do Nilton, 2026-07-17) —
# são só segmentos de caminho; a data no post-card é texto, não link.
[permalinks]
  posts = '/:year/:month/:day/:slug/'
