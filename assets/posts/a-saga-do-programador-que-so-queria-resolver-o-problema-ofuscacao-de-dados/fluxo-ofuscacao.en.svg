<svg xmlns="http://www.w3.org/2000/svg" id="dg-fluxo-ofuscacao" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="dg-fluxo-ofuscacao-t"><title id="dg-fluxo-ofuscacao-t">Obfuscating production data for the troubleshooting environment</title><style>#dg-fluxo-ofuscacao{--dg-bg:var(--background, #1a170f);--dg-fg:var(--foreground, #eceae5);--dg-accent:var(--accent, #eec35e);--dg-quiet:var(--accent-quiet, #eecf8c);--dg-line:var(--accent-line, #715e31);--dg-mute:var(--accent-mute, #5c4d2a);--dg-band:var(--code-bg, #14110a);--dg-chip:var(--chip-text, rgb(236 234 229 / .82));--dg-muted:color-mix(in oklab, var(--dg-fg) 68%, var(--dg-bg));--dg-alert:oklch(from var(--dg-accent) 0.78 0.14 calc(h + 180));--dg-alert-soft:color-mix(in oklab, var(--dg-alert) 22%, var(--dg-bg));--dg-font:var(--font-body, 'IBM Plex Mono', ui-monospace, monospace);--dg-mono:var(--font-ibm, 'IBM Plex Mono', ui-monospace, monospace)}#dg-fluxo-ofuscacao .bg{fill:var(--dg-bg)}#dg-fluxo-ofuscacao .band{fill:var(--dg-band)}#dg-fluxo-ofuscacao .bl{font-family:var(--dg-font);font-size:10.5px;font-weight:500;letter-spacing:.06em;fill:var(--dg-muted);paint-order:stroke;stroke:var(--dg-band);stroke-width:6px;stroke-linejoin:round}#dg-fluxo-ofuscacao .n{fill:var(--dg-bg);stroke:var(--dg-line);stroke-width:1.2}#dg-fluxo-ofuscacao .n.destaque{fill:var(--dg-mute);stroke:var(--dg-accent);stroke-width:2}#dg-fluxo-ofuscacao .n.novo{stroke:var(--dg-muted);stroke-dasharray:5 4}#dg-fluxo-ofuscacao .n.gatilho{fill:var(--dg-fg);stroke:var(--dg-fg)}#dg-fluxo-ofuscacao .n.lacuna{fill:var(--dg-alert-soft);stroke:var(--dg-alert);stroke-width:2}#dg-fluxo-ofuscacao .nt{font-family:var(--dg-font);font-size:13px;font-weight:600;fill:var(--dg-fg);text-anchor:middle}#dg-fluxo-ofuscacao .nt.destaque{fill:var(--dg-fg)}#dg-fluxo-ofuscacao .nt.gatilho{fill:var(--dg-bg)}#dg-fluxo-ofuscacao .nt.lacuna{fill:var(--dg-alert)}#dg-fluxo-ofuscacao .ns{font-family:var(--dg-font);font-size:11px;font-weight:400;fill:var(--dg-muted);text-anchor:middle}#dg-fluxo-ofuscacao .nr{font-family:var(--dg-mono);font-size:10.5px;font-weight:400;fill:var(--dg-muted);text-anchor:middle}#dg-fluxo-ofuscacao .ns.gatilho,#dg-fluxo-ofuscacao .nr.gatilho{fill:var(--dg-bg);opacity:.85}#dg-fluxo-ofuscacao .grp{fill:none;stroke-width:1.5}#dg-fluxo-ofuscacao .grp.destaque{stroke:var(--dg-accent)}#dg-fluxo-ofuscacao .grp.lacuna{stroke:var(--dg-alert)}#dg-fluxo-ofuscacao .gt{font-family:var(--dg-font);font-size:11px;font-weight:600}#dg-fluxo-ofuscacao .gt.destaque{fill:var(--dg-accent)}#dg-fluxo-ofuscacao .gt.lacuna{fill:var(--dg-alert)}#dg-fluxo-ofuscacao .e{fill:none;stroke:var(--dg-muted);stroke-width:1.5}#dg-fluxo-ofuscacao .e.novo{stroke-dasharray:6 4}#dg-fluxo-ofuscacao .e.erro{stroke:var(--dg-alert)}#dg-fluxo-ofuscacao .ahp{fill:var(--dg-muted)}#dg-fluxo-ofuscacao .ahp.erro{fill:var(--dg-alert)}#dg-fluxo-ofuscacao .nb{fill:var(--dg-accent)}#dg-fluxo-ofuscacao .eb{fill:var(--dg-alert)}#dg-fluxo-ofuscacao .nbt{font-family:var(--dg-font);font-size:11px;font-weight:700;fill:var(--dg-bg);text-anchor:middle}#dg-fluxo-ofuscacao .kt{font-family:var(--dg-font);font-size:12px;font-weight:400;fill:var(--dg-muted)}#dg-fluxo-ofuscacao .et{font-family:var(--dg-font);font-size:12px;font-weight:600;fill:var(--dg-alert)}#dg-fluxo-ofuscacao .ex{font-family:var(--dg-font);font-size:12px;font-weight:400;fill:var(--dg-fg)}#dg-fluxo-ofuscacao .eh{font-family:var(--dg-font);font-size:10.5px;font-weight:500;letter-spacing:.06em;fill:var(--dg-muted)}#dg-fluxo-ofuscacao .ntl{font-family:var(--dg-font);font-size:12px;font-weight:600;fill:var(--dg-fg)}#dg-fluxo-ofuscacao rect{rx:0;ry:0}#dg-fluxo-ofuscacao .bg{stroke:var(--dg-line);stroke-width:2}#dg-fluxo-ofuscacao .bl{fill:var(--dg-quiet)}#dg-fluxo-ofuscacao .nt.lacuna{fill:var(--dg-fg)}#dg-fluxo-ofuscacao .ns.destaque,#dg-fluxo-ofuscacao .nr.destaque,#dg-fluxo-ofuscacao .ns.lacuna,#dg-fluxo-ofuscacao .nr.lacuna{fill:var(--dg-chip)}#dg-fluxo-ofuscacao .eh{fill:var(--dg-quiet)}</style><defs><marker id="ah-dg-fluxo-ofuscacao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-err-dg-fluxo-ofuscacao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp erro" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="100%" height="100%" rx="12"/><rect class="band" x="8" y="8" width="784" height="96" rx="12"/><rect class="band" x="8" y="124" width="784" height="96" rx="12"/><rect class="band" x="8" y="240" width="784" height="96" rx="12"/><rect class="n " x="20" y="40" width="150" height="44" rx="8"/><text class="nt " x="95" y="65.9">Application</text><rect class="n " x="290" y="40" width="190" height="44" rx="8"/><text class="nt " x="385" y="65.9">Production database</text><rect class="n gatilho" x="560" y="40" width="220" height="44" rx="8"/><text class="nt gatilho" x="670" y="65.9">Trigger</text><rect class="n destaque" x="560" y="156" width="220" height="44" rx="8"/><text class="nt destaque" x="670" y="181.9">Obfuscation function</text><rect class="n " x="520" y="272" width="260" height="44" rx="8"/><text class="nt " x="650" y="297.9">Troubleshooting database</text><path class="e " d="M170,62 H290" marker-end="url(#ah-dg-fluxo-ofuscacao)"/><path class="e " d="M480,62 H560" marker-end="url(#ah-dg-fluxo-ofuscacao)"/><path class="e " d="M670,84 V156" marker-end="url(#ah-dg-fluxo-ofuscacao)"/><path class="e " d="M670,200 V272" marker-end="url(#ah-dg-fluxo-ofuscacao)"/><rect class="nb" x="220" y="52" width="20" height="20" rx="10"/><text class="nbt" x="230" y="66">1</text><rect class="nb" x="510" y="52" width="20" height="20" rx="10"/><text class="nbt" x="520" y="66">2</text><rect class="nb" x="660" y="110" width="20" height="20" rx="10"/><text class="nbt" x="670" y="124">3</text><rect class="nb" x="660" y="226" width="20" height="20" rx="10"/><text class="nbt" x="670" y="240">4</text><text class="bl" x="22" y="28">PRODUCTION</text><text class="bl" x="22" y="144">SERVERLESS</text><text class="bl" x="22" y="260">TROUBLESHOOTING</text></svg>
