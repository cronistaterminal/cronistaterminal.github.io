<!-- c-term-icon.svg — a MAE do icone C.T (fonte-de-verdade, recuperada em 2026-07-19).
     Os PNGs de favicon foram queimados desta forma; o SVG original nunca tinha sido salvo.

     Composicao, na viewBox "16 5 100 100" (a mesma do .logo-icon em layouts/partials/logo.html):
       - 6 faixas CRT + scanline: geometria VETORIAL reaproveitada verbatim do logo.html.
       - cores: snapshot FIXO do tema default (tokens stripe-1 a stripe-6). Auto-contido de
         proposito (um .svg nao tem contexto de tema); casa com o favicon, que tambem e default.
       - "C.T": glifos REAIS da 3270 Nerd Font (Regular), extraidos como path via fontTools
         (NAO e tracado a mao). Gap proprio (a fonte e mono-ish; advance widths deixariam
         buracos), escala uniforme pela altura, centralizado.
       - glifo em #ECEAE5 (a cor foreground do default, medida no favicon).

     Re-render em PNG: rsvg-convert -w N -h N c-term-icon.svg. -->
