# Tudo que constrói a página 404 mora aqui — texto, ritmo e vídeos.
# Nada disto é código: mexer no easter egg não deveria exigir tocar num template.
#
# A frase é partida em pedaços porque UM deles apodrece — e porque ela quebra em duas
# linhas: o convite (volte) e a ameaça (mas corra).
#
#   {prefix}{link}{after_link}
#   {middle}{decay}{suffix}
#
#   "Olá! Você deve estar perdido, [clique aqui para voltar].
#    Mas clique rápido pois «as coisas tendem a ficar estranhas por aqui»."
#                            ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ trocado a cada segundo,
#                            a partir de timing.decay_starts.

prefix = "Olá! Você deve estar perdido, "
link = "clique aqui para voltar"
after_link = "."
middle = "Mas clique rápido pois "
decay = "as coisas tendem a ficar estranhas por aqui"
suffix = "."

# Os estados do apodrecimento moram em data/decay.toml, em base64 — Zalgo cru
# sangra para as linhas vizinhas do editor e destrói o diff. Para editá-los:
#
#   just decay-edit   ->  .decay.txt (Zalgo legível, fora do git)
#   just decay-save   ->  volta para data/decay.toml
#
# O Zalgo fica SÓ no visual (aria-hidden); o leitor de tela sempre ouve o `decay`
# original acima, estável e em português.

[timing]
# Segundos até voltar sozinho para a home. O contador é VISÍVEL e cancelável —
# senão a página teleportaria quem lê devagar ou usa leitor de tela (WCAG 2.2.1).
redirect_after = 10
# Quando o texto começa a apodrecer. Os decay_steps consomem um segundo cada.
decay_starts = 5

# ---------------------------------------------------------------------------
# Vídeos. Um é sorteado NO CLIENTE a cada visita (se o Hugo sorteasse, seria o
# mesmo vídeo até o próximo deploy — "aleatório" uma vez só).
#
# `mensagem` é o easter egg: aparece como legenda do cartão.
# `link` aceita a URL normal do YouTube (watch?v=…) ou youtu.be — o template
# extrai o id e monta a URL do youtube-nocookie sozinho, igual ao shortcode embed.
# ---------------------------------------------------------------------------

[[videos]]
canal = "Computerphile"
titulo = "The Most Difficult Program to Compute?"
link = "https://www.youtube.com/watch?v=i7sm9dzFtEI"
mensagem = "Alguns caminhos não terminam. Este aqui, por sorte, termina na home."

[[videos]]
canal = "8-bit Guy"
