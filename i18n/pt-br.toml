# Strings de interface — pt-BR (idioma padrão). O irmão é en.toml: TODA chave daqui
# existe lá, e vice-versa. `just i18n` confere a paridade.
#
# Dois mundos de placeholder, e eles não se misturam:
#   {{ .x }}  -> chave usada por TEMPLATE: o Hugo renderiza no build.
#   {x}       -> chave usada por JS (prefixo js_): o Hugo devolve o texto cru, e o
#                tr() de assets/js/i18n.js substitui no navegador.
# Uma chave js_ com {{ }} seria resolvida pelo Hugo no build, com contexto vazio.

